name: s9-panvk
on:
  workflow_dispatch:
  push:
    branches: [codex/panvk-bringup]
    paths: ["s9/panvk/**", ".github/workflows/s9-panvk.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          pip install meson ninja mako pyyaml packaging pycparser
          brew install llvm spirv-tools spirv-llvm-translator bison flex pkgconf
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Pinned Mesa source
        run: |
          git init -q mesa
          git -C mesa fetch --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git fc8ba4378f37c152e0443dadcb9384a7da0cad4a
          git -C mesa checkout --detach FETCH_HEAD
          test "$(git -C mesa rev-parse HEAD)" = fc8ba4378f37c152e0443dadcb9384a7da0cad4a
      - name: iOS diagnostic and synchronization tests
        run: |
          mkdir -p out
          cc -O2 -Wall -Wextra -Werror -pthread s9/panvk/test-sync.c -o out/test-sync
          out/test-sync | tee out/sync-test.log
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" -Imesa/include -O2 -Wall -Wextra -Werror -Wl,-fixup_chains s9/panvk/vkprobe.c -o out/vkprobe
          codesign -f -s - out/vkprobe
      - name: Restore native shader tools
        id: native-tools
        uses: actions/cache/restore@v4
        with:
          path: native-bin
          key: s9-panvk-native-macos15-intel-mesa-fc8ba437-llvm22-v1
      - name: Native shader generators
        if: steps.native-tools.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p out
          export CC=clang CXX=clang++
          export PKG_CONFIG_PATH="$(brew --prefix llvm)/lib/pkgconfig:$(brew --prefix spirv-tools)/lib/pkgconfig:$(brew --prefix spirv-llvm-translator)/lib/pkgconfig"
          meson setup build-host mesa --buildtype=release -Db_ndebug=true \
            -Dplatforms= -Dgallium-drivers= -Dvulkan-drivers= -Dtools=panfrost \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dopengl=false \
            -Dgles1=disabled -Dgles2=disabled -Dllvm=enabled -Dmesa-clc=enabled \
            -Dprecomp-compiler=enabled -Dinstall-mesa-clc=true -Dinstall-precomp-compiler=true -Dpanfrost-rust=false -Dpanfrost-disassemble=false \
            -Dbuild-tests=false -Dshader-cache=disabled -Dxmlconfig=disabled \
            -Dcmake_prefix_path="$(brew --prefix llvm)" 2>&1 | tee out/host-configure.log
          ninja -C build-host -j3 src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile 2>&1 | tee out/host-build.log
          mkdir -p native-bin
          cp build-host/src/compiler/clc/mesa_clc build-host/src/compiler/spirv/vtn_bindgen2 build-host/src/panfrost/clc/panfrost_compile native-bin/
      - name: Save native shader tools
        if: steps.native-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-bin
          key: s9-panvk-native-macos15-intel-mesa-fc8ba437-llvm22-v1
      - name: Shader tool path
        run: echo "$PWD/native-bin" >> "$GITHUB_PATH"
      - name: iOS PanVK and probe
        run: |
          set -o pipefail
          python3 s9/panvk/prepare-mesa.py mesa
          python3 s9/panvk/test-syncfile.py mesa/src/s9-drm/sweet_drm.c | tee out/syncfile-test.log
          bash s9/panvk/build-ios.sh mesa out 2>&1 | tee out/ios-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s9-panvk-build
          path: |
            out/*.log
            out/*.txt
            out/*.dylib
            out/vkprobe
            out/SHA256SUMS
            out/build-ios/meson-logs/meson-log.txt
            build-host/meson-logs/meson-log.txt
