name: qc-probe
# Finds QuartzCore GL renderer addresses (sweetgl texture-function fixes,
# trace hooks) in the iPhone X iOS 16.7.16 dyld shared cache. Nothing from
# the cache is committed or uploaded: results are reported as annotations.
on:
  workflow_dispatch:
    inputs:
      disass:
        description: "symbols to disassemble (regex on the mangled name, comma separated)"
        default: ""
      delta:
        description: "offset from the ios-sailfish addresses to check"
        default: "0x4000"
      sym:
        description: "unslid shared-cache addresses to symbolicate (space separated)"
        default: ""

permissions:
  contents: read

env:
  IPSW_URL: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: ipsw tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view -R blacktop/ipsw --json assets -q '.assets[].name')
          echo "$assets" | grep -i linux || true
          a=$(echo "$assets" | grep -iE '^ipsw_.*linux.*(x86_64|amd64).*\.tar\.gz$' | grep -viE 'extras|ipswd|debug' | head -1)
          [ -n "$a" ] || { echo "::error::no linux asset in: $(echo $assets)"; exit 1; }
          gh release download -R blacktop/ipsw -p "$a" -D /tmp/ipsw
          tar -xzf /tmp/ipsw/*.tar.gz -C /tmp/ipsw
          sudo install -m 755 "$(find /tmp/ipsw -type f -name ipsw | head -1)" /usr/local/bin/ipsw
          ipsw version
      - name: apfs-fuse
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q apfs-fuse >/dev/null 2>&1 || true
          if ! command -v apfs-fuse >/dev/null; then
            sudo apt-get install -y -q cmake g++ libfuse3-dev fuse3 zlib1g-dev libbz2-dev libattr1-dev liblzma-dev >/dev/null
            git clone -q --recursive https://github.com/sgan81/apfs-fuse /tmp/apfs-fuse
            cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CXX_FLAGS="-include cstdint" -DCMAKE_C_FLAGS="-Wno-error" >/dev/null
            make -C /tmp/apfs-fuse/build -j"$(nproc)" 2>&1 | grep -E "error|Error" || true
            sudo install -m 755 /tmp/apfs-fuse/build/apfs-fuse /usr/local/bin/apfs-fuse
          fi
          command -v apfs-fuse
      - name: dyld shared cache
        run: |
          df -h /
          mkdir -p "$RUNNER_TEMP/dsc"
          ipsw extract --help 2>&1 | grep -iE "remote|dyld|output" | head -20
          sudo -E env PATH="$PATH" ipsw extract --dyld --dyld-arch arm64 --remote -o "$RUNNER_TEMP/dsc" "$IPSW_URL" > "$RUNNER_TEMP/ex.log" 2>&1 || true
          tail -c 3000 "$RUNNER_TEMP/ex.log"
          sudo chown -R "$USER" "$RUNNER_TEMP/dsc"; chmod -R u+rwX "$RUNNER_TEMP/dsc"
          find "$RUNNER_TEMP/dsc" -type f | head -40
          cache=$(find "$RUNNER_TEMP/dsc" -type f -name 'dyld_shared_cache_arm64' | head -1)
          [ -n "$cache" ] || { echo "::error::no cache extracted: $(tail -c 3000 "$RUNNER_TEMP/ex.log" | tr '\n' ' ')"; exit 1; }
          echo "CACHE=$cache" >> "$GITHUB_ENV"
      - name: probe
        env:
          DISASS: ${{ inputs.disass }}
        run: |
          python3 -I s9/tools/qc-verify.py "$CACHE" "${{ inputs.delta || '0x4000' }}"
          [ -z "${{ inputs.sym }}" ] || python3 -I s9/tools/qc-sym.py "$CACHE" "${{ inputs.sym }}"
          [ -z "$DISASS" ] || python3 -I s9/tools/qc-probe.py "$CACHE" "$DISASS"
