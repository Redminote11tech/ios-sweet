name: s9-image

# Packages a Galaxy S9 (Exynos 9810) shim image from an xnu kernel build:
# S9 ADT (s9/tools/mkadt_s9.py) + kernel -> payload (tools/mkpayload.py) ->
# shim with the payload linked in (s9/shim/build.sh) -> xnu-Image.
#
# Download the "s9-xnu-image" artifact from this run, then on your PC:
#   python3 s9/shim/repack.py BOOT.img xnu-Image shim-boot.img
# The same files are also pushed to the s9-builds branch.

on:
  workflow_run:
    workflows: [xnu]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: xnu workflow run to package (empty = latest successful)
        default: ""
      ramdisk:
        description: "RAM disk root: init (tools/sweet-init as /sbin/launchd, add rd=md0) or none"
        default: "init"
      cmdline:
        description: XNU boot-args
        default: "debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam -noprogress rd=md0 sweetkeys=0 sweettouch=0 sweetusb=0 wdt=-1 wdt_test=no_user_checkin"

permissions:
  contents: write
  actions: read

env:
  IPSW_URL: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
  CMDLINE: ${{ inputs.cmdline || 'debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam -noprogress rd=md0 sweetkeys=0 sweettouch=0 sweetusb=0 wdt=-1 wdt_test=no_user_checkin' }}

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pick the xnu run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ inputs.run_id }}"
          [ -n "$id" ] || id="${{ github.event.workflow_run.id }}"
          [ -n "$id" ] || id=$(gh run list -R "$GITHUB_REPOSITORY" -w xnu -s success -L 1 --json databaseId -q '.[0].databaseId')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "xnu run: $id"

      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: kernel

      - name: Tools
        run: sudo apt-get install -y -q clang lld llvm

      # /product of the real iPhone X device tree (MobileGestalt needs it), read
      # from Apple's IPSW with range requests at build time; never committed.
      - name: iPhone X device tree
        continue-on-error: true
        run: |
          pip install -q pyimg4
          python3 tools/remotezip.py "$IPSW_URL" DeviceTree.d22ap.im4p research/ipsw-x/dt
          f=$(find research/ipsw-x/dt -name DeviceTree.d22ap.im4p | head -1)
          pyimg4 im4p extract -i "$f" -o research/ipsw-x/d22ap.adt
          ls -la research/ipsw-x/d22ap.adt

      - name: Build
        run: |
          mkdir -p dist
          set -o pipefail
          {
            set -ex
            ls -la kernel
            K=kernel/kernel.development.sweet
            [ -f "$K" ] || K=$(ls kernel/kernel.development.* | grep -v dSYM | head -1)
            python3 s9/tools/mkadt_s9.py s9.adt --dump > dist/s9-adt.txt
            RD=""
            if [ "${{ inputs.ramdisk || 'init' }}" = init ]; then
              # mockfs serves the RAM disk itself as /sbin/launchd (patches 0021/0024)
              clang -target arm64-apple-ios16.0 -c tools/sweet-init.S -o sweet-init.o
              python3 tools/mkinit.py sweet-init.o sweet-init
              RD="--ramdisk sweet-init"
            fi
            python3 tools/mkpayload.py "$K" s9.adt payload.bin --cmdline "$CMDLINE" $RD | tee dist/payload.txt
            sh s9/shim/build.sh payload.bin
            cp s9/shim/xnu-Image s9/shim/t2-Image s9/shim/t0-Image s9.adt dist/
            cp "$K" dist/
          } 2>&1 | tee dist/build.log
          echo "xnu run ${{ steps.run.outputs.id }}, commit $GITHUB_SHA" > dist/BUILD.txt
          echo "cmdline: $CMDLINE" >> dist/BUILD.txt
          echo "ramdisk: ${{ inputs.ramdisk || 'init' }}" >> dist/BUILD.txt

      - name: Host test of the loader
        run: |
          set -o pipefail
          cd s9/shim
          python3 mkdtb.py
          cc -DHOST -O1 -Wall -o test_host test_host.c main.c 2>&1 | tee ../../dist/loader-test.txt
          ./test_host ../../payload.bin 2>&1 | tee -a ../../dist/loader-test.txt

      - name: Checksums
        if: always()
        run: (cd dist && sha256sum * > SHA256SUMS; ls -la)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s9-xnu-image
          path: dist/

      # Also when a step failed: build.log is how a failure gets diagnosed.
      - name: Push to the s9-builds branch
        if: always()
        run: |
          cd dist
          git init -q
          git checkout -q -b s9-builds
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "s9 image from xnu run ${{ steps.run.outputs.id }} ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" s9-builds
